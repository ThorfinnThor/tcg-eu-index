[project]
name = "tcg-eu-index"
version = "0.1.0"
description = "European TCG listing-price index platform"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "click>=8.1",
  "matplotlib>=3.9",
  "polars>=1.9",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[dependency-groups]
dev = [
  "moto[s3]>=5.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.uv.sources]
tcg-eu-index-core = { workspace = true }
tcg-eu-index-ingest = { workspace = true }
tcg-eu-index-engine = { workspace = true }
tcg-eu-index-reports = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/ingest", "packages/indexengine", "packages/reports"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["work", ".venv", "apps/web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "ingest", "indexengine", "reports"]
mypy_path = ["packages/core", "packages/ingest", "packages/indexengine", "packages/reports"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/ingest", "packages/indexengine", "packages/reports"]
testpaths = ["tests"]
