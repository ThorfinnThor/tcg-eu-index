name: static-data-check

on:
  workflow_dispatch: {}

jobs:
  static_data_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run data:export
      - run: npm --prefix apps/web run data:validate
      - name: Retain static build report
        uses: actions/upload-artifact@v7
        with:
          name: static-build-report-${{ github.run_id }}
          path: apps/web/generated/reports/static-build.json
          retention-days: 30
      - run: npm --prefix apps/web run build
