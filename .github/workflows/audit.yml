name: cardmarket-archive-audit

on:
  schedule:
    - cron: "30 15 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || vars.ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'tcg-raw' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Validate archive inception
        run: test -n "${{ vars.ARCHIVE_INCEPTION_DATE }}"
      - name: Audit calendar coverage and a deterministic 5% file sample
        run: |
          uv run python scripts/verify_archive.py \
            --since "${{ vars.ARCHIVE_INCEPTION_DATE }}" \
            --sample-rate 0.05 \
            --output archive-audit.json
      - name: Retain audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cardmarket-archive-audit-${{ github.run_id }}
          path: archive-audit.json
          if-no-files-found: warn
          retention-days: 90
