name: cardmarket-archive-audit

on:
  schedule:
    - cron: "30 15 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || vars.ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'tcg-raw' }}
      ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Validate archive inception
        run: test -n "${{ vars.ARCHIVE_INCEPTION_DATE }}"
      - name: Audit calendar coverage and a deterministic 5% file sample
        run: |
          uv run python scripts/verify_archive.py \
            --since "${{ vars.ARCHIVE_INCEPTION_DATE }}" \
            --game-inceptions "onepiece=${{ vars.ARCHIVE_INCEPTION_DATE }},pokemon=${{ vars.ARCHIVE_INCEPTION_DATE }},magic=2026-08-12,yugioh=2026-08-12,dragonballsuper=2026-08-12,fleshandblood=2026-08-12,digimon=2026-08-12,lorcana=2026-08-12,starwarsunlimited=2026-08-12,riftbound=2026-08-12" \
            --sample-rate 0.05 \
            --output archive-audit.json \
            --summary-output archive-audit.md
      - name: Update aggregate public archive health
        if: always()
        run: |
          if test -f archive-audit.json; then
            uv run python scripts/update_public_archive_health.py \
              --audit-report archive-audit.json \
              --output apps/web/source-data/archive-health.json
          fi
      - name: Publish audit summary
        if: always()
        run: |
          if test -f archive-audit.md; then
            cat archive-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Cardmarket archive audit" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cardmarket-archive-audit-${{ github.run_id }}
          path: |
            archive-audit.json
            archive-audit.md
            apps/web/source-data/archive-health.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit public archive health
        if: always()
        run: |
          if git diff --quiet -- apps/web/source-data/archive-health.json; then
            echo "Public archive health is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/source-data/archive-health.json
          git commit -m "chore(audit): update public archive health"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Post audit digest
        if: always()
        env:
          PIPELINE_STATUS: ${{ job.status }}
        run: |
          if test "$PIPELINE_STATUS" = "success"; then level="OK"; else level="CRITICAL"; fi
          uv run python scripts/notify_pipeline.py --level "$level" \
            --message "Weekly Cardmarket archive integrity audit: ${PIPELINE_STATUS}."
