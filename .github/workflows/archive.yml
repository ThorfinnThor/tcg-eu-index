name: cardmarket-daily-archive

on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "10 8 * * *"
    - cron: "10 11 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: UTC date (YYYY-MM-DD) or today
        required: false
        default: today
      force_reprocess:
        description: Re-run normalization and index calculation for an archived date
        required: false
        type: boolean
        default: false

concurrency:
  group: cardmarket-daily-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || vars.ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CM_GAMES: magic,yugioh,pokemon,onepiece,dragonballsuper,fleshandblood,digimon,lorcana,starwarsunlimited,riftbound
      CM_USER_AGENT: tcg-eu-index/1.0 contact=${{ vars.CM_CONTACT_EMAIL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'tcg-raw' }}
      ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Validate operator identity
        run: test -n "${{ vars.CM_CONTACT_EMAIL }}"
      - name: Check whether this date was already processed
        id: archive_state
        env:
          REQUESTED_DATE: ${{ inputs.run_date || 'today' }}
          FORCE_REPROCESS: ${{ inputs.force_reprocess || 'false' }}
        run: |
          effective_date="$REQUESTED_DATE"
          if test "$effective_date" = "today"; then
            effective_date="$(date -u +%F)"
          fi
          latest_date="$(python -c 'import json; print(json.load(open("data/manifest-latest.json"))["date"])')"
          if test "$latest_date" = "$effective_date" && test "$FORCE_REPROCESS" != "true"; then
            echo "already_processed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_processed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive and verify official Cardmarket snapshots
        run: |
          set -o pipefail
          uv run --package tcg-eu-index-ingest python -m ingest.archive \
            --date "${{ inputs.run_date || 'today' }}" | tee archive-result.json
      - name: Normalize verified catalogue and prices
        if: steps.archive_state.outputs.already_processed != 'true'
        run: |
          set -o pipefail
          uv run --package tcg-eu-index-ingest python -m ingest.normalize \
            --date "${{ inputs.run_date || 'today' }}" | tee normalize-result.json
      - name: Calculate private shadow indexes
        if: steps.archive_state.outputs.already_processed != 'true'
        run: |
          set -o pipefail
          uv run --package tcg-eu-index-engine python -m indexengine.calc \
            --date "${{ inputs.run_date || 'today' }}" | tee calc-result.json
      - name: Update aggregate public readiness receipt
        if: steps.archive_state.outputs.already_processed != 'true'
        run: |
          uv run python scripts/update_public_readiness.py \
            --calc-result calc-result.json \
            --manifest data/manifest-latest.json \
            --output apps/web/source-data/readiness.json
      - name: Retain pipeline receipt
        uses: actions/upload-artifact@v7
        with:
          name: cardmarket-archive-${{ github.run_id }}
          path: |
            archive-result.json
            normalize-result.json
            calc-result.json
            data/manifest-latest.json
            apps/web/source-data/readiness.json
          retention-days: 30
      - name: Commit archive heartbeat
        run: |
          if git diff --quiet -- data/manifest-latest.json apps/web/source-data/readiness.json; then
            echo "Archive already recorded; no heartbeat change."
            exit 0
          fi
          archive_date="$(python -c 'import json; print(json.load(open("data/manifest-latest.json"))["date"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest-latest.json apps/web/source-data/readiness.json
          git commit -m "chore(archive): ${archive_date}"
          git push origin HEAD:main
