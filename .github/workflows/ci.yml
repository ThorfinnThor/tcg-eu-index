name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_methodology_sync.py
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run data:export
      - run: npm --prefix apps/web run data:validate
      - name: Retain static build report
        uses: actions/upload-artifact@v7
        with:
          name: static-build-report-${{ github.run_id }}
          path: apps/web/generated/reports/static-build.json
          retention-days: 30
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run build
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
