name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_methodology_sync.py

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [static, cloudflare, e2e]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Export and validate static data
        if: matrix.check == 'static'
        run: |
          npm --prefix apps/web run data:export
          npm --prefix apps/web run data:validate
      - name: Retain static build report
        if: matrix.check == 'static'
        uses: actions/upload-artifact@v7
        with:
          name: static-build-report-${{ github.run_id }}
          path: apps/web/generated/reports/static-build.json
          retention-days: 30
      - name: Lint, test, and build Next.js
        if: matrix.check == 'static'
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run test
          npm --prefix apps/web run build
      - name: Validate Cloudflare Worker build
        if: matrix.check == 'cloudflare'
        run: |
          npm --prefix apps/web run typecheck:worker
          npm --prefix apps/web run build:vinext
          npm --prefix apps/web run deploy:dry-run
      - name: Install Chromium
        if: matrix.check == 'e2e'
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Build Next.js for browser regression
        if: matrix.check == 'e2e'
        run: npm --prefix apps/web run build
      - name: Run browser regression
        if: matrix.check == 'e2e'
        run: npm --prefix apps/web run test:e2e
