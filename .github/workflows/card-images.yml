name: card-image-pipeline

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: Collector dataset version (normally YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

jobs:
  public_catalogue_snapshots_and_match:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'tcg-raw' }}
      OPTCG_API_KEY: ${{ secrets.OPTCG_API_KEY }}
      APITCG_API_KEY: ${{ secrets.APITCG_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Audit image prerequisites
        run: >-
          uv run python -m indexengine.card_images.cli audit
          --collector-root apps/web/source-data/collector
          --output-root reports/images
      - name: Sync immutable Scryfall bulk snapshot
        run: uv run python -m indexengine.card_images.cli sync-scryfall
      - name: Sync immutable public TCG catalogue snapshots
        run: uv run python -m indexengine.card_images.cli sync-catalogs
      - name: Sync credentialed One Piece catalogue snapshot
        if: env.OPTCG_API_KEY != ''
        run: uv run python -m indexengine.card_images.cli sync-catalogs --provider optcg
      - name: Sync credentialed Dragon Ball catalogue snapshots
        if: env.APITCG_API_KEY != ''
        run: uv run python -m indexengine.card_images.cli sync-catalogs --provider dragonball
      - name: Match Magic offline against active snapshot
        run: >-
          uv run python -m indexengine.card_images.cli match-magic
          --dataset-version "${{ inputs.dataset_version }}"
          --collector-root apps/web/source-data/collector
          --report-root reports/images
      - name: Match all other public catalogues offline against active snapshots
        run: >-
          uv run python -m indexengine.card_images.cli match-catalogs
          --dataset-version "${{ inputs.dataset_version }}"
          --collector-root apps/web/source-data/collector
      - name: Build deterministic activation QA
        run: >-
          uv run python -m indexengine.card_images.cli qa-magic
          --dataset-version "${{ inputs.dataset_version }}"
          --collector-root apps/web/source-data/collector
          --report-root reports/images
      - name: Materialize validated metadata and images into the web projection
        run: >-
          uv run python -m indexengine.card_images.cli materialize-web
          --source-data-root apps/web/source-data
      - name: Commit the validated card-image projection
        run: |
          changes="$(git status --porcelain -- apps/web/source-data)"
          if test -z "$changes"; then
            echo "Card-image projection is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/source-data
          git commit -m "chore(images): refresh ${DATASET_VERSION}"
          # Catalogue sync also refreshes tracked reports outside source-data.
          # Keep those runner-only changes out of the projection commit while
          # still allowing a concurrent main update to be rebased safely.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
      - name: Retain image quality reports
        uses: actions/upload-artifact@v7
        with:
          name: card-image-reports-${{ inputs.dataset_version }}-${{ github.run_id }}
          path: reports/images
          retention-days: 90
