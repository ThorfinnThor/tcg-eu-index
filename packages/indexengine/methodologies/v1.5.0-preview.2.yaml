  diagnostics_prefix: "derived/diagnostics/{methodology_version}/{index_code}"
  series_id: "{index_code}:{methodology_version}:{data_state}"
  public_alias_enabled: false

calibration:
  alternate_valuation_fields: ["avg7"]
  require_activity_proxy_validation: true
  require_human_cutover: true
  splice_with_prior_methodology: false
